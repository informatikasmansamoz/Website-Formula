<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broadcast Screen · 1 WiFi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ===== LOBBY ===== */
        #lobby {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
            position: relative;
            z-index: 1000;
        }

        .lobby-box {
            background: rgba(22, 27, 46, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem 3.5rem;
            border-radius: 2.5rem;
            border: 1px solid #2f3550;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .lobby-box h1 {
            color: #fff;
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 0.3rem;
        }

        .lobby-box h1 span {
            color: #4a7cf7;
            font-weight: 600;
        }

        .lobby-box .subtitle {
            color: #8a93b5;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #2a2f46;
            padding-bottom: 1.5rem;
        }

        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .role-btn {
            padding: 16px 28px;
            border: 2px solid #2f3550;
            border-radius: 60px;
            background: transparent;
            color: #c8d0e8;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .role-btn i {
            font-size: 1.3rem;
        }

        .role-btn:hover {
            transform: translateY(-2px);
            border-color: #4a7cf7;
            background: rgba(74, 124, 247, 0.1);
            color: #fff;
        }

        .role-btn.guru {
            background: linear-gradient(135deg, #4a7cf7, #6c5ce7);
            border-color: transparent;
            color: #fff;
        }

        .role-btn.guru:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(74, 124, 247, 0.3);
        }

        .role-btn.siswa {
            border-color: #3a405a;
        }

        .role-btn.siswa:hover {
            border-color: #00d26a;
            background: rgba(0, 210, 106, 0.08);
        }

        .lobby-footer {
            margin-top: 1.5rem;
            color: #4a5a7a;
            font-size: 0.8rem;
        }

        .lobby-footer i {
            color: #ffb347;
        }

        /* ===== MAIN APP ===== */
        #app-container {
            width: 100vw;
            height: 100vh;
            display: none;
            flex-direction: column;
            background: #0f1322;
        }

        #app-container.active {
            display: flex;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            background: #161b2e;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2f46;
            flex-shrink: 0;
            z-index: 10;
        }

        .top-bar .brand {
            color: #a8b3d9;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar .brand i {
            color: #4a7cf7;
        }

        .top-bar .status {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #8a93b5;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .status .live-dot {
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }

        .status .live-dot.on {
            background: #00d26a;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .status .role-badge {
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid #2f3550;
        }

        .status .role-badge.guru {
            border-color: #4a7cf7;
            color: #4a7cf7;
        }

        .status .role-badge.siswa {
            border-color: #00d26a;
            color: #00d26a;
        }

        .status .wifi-badge {
            color: #ffb347;
            font-size: 0.8rem;
        }

        /* ===== SCREEN AREA ===== */
        .screen-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0a0e1a;
            position: relative;
            min-height: 0;
        }

        #screen-video {
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 80px);
            background: #0d111f;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border: 1px solid #242943;
        }

        .waiting-message {
            position: absolute;
            color: #4a5a7a;
            font-size: 1.2rem;
            text-align: center;
            pointer-events: none;
        }

        .waiting-message i {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
            color: #2f3550;
        }

        /* ===== FLOATING CONTROLS ===== */
        .floating-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 27, 46, 0.95);
            backdrop-filter: blur(16px);
            padding: 10px 20px;
            border-radius: 60px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid #2f3550;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
        }

        .floating-controls button {
            background: transparent;
            border: none;
            color: #c8d0e8;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s;
            border: 1px solid transparent;
        }

        .floating-controls button:hover {
            background: #282f4a;
            color: #fff;
        }

        .floating-controls button.primary {
            background: #4a7cf7;
            color: #fff;
        }

        .floating-controls button.primary:hover {
            background: #5f8cf9;
            transform: scale(1.03);
        }

        .floating-controls button.danger {
            color: #ff6b6b;
        }

        .floating-controls button.danger:hover {
            background: #3a1e2e;
            border-color: #ff6b6b44;
        }

        .floating-controls button.success {
            color: #00d26a;
        }

        .floating-controls button.success:hover {
            background: #1a2e2a;
            border-color: #00d26a44;
        }

        .floating-controls .sep {
            width: 1px;
            height: 28px;
            background: #2f3550;
        }

        /* ===== LOCK OVERLAY (popup password) ===== */
        #lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 999999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1.5rem;
            padding: 2rem;
        }

        #lock-overlay.active {
            display: flex;
        }

        .lock-box {
            background: rgba(22, 27, 46, 0.95);
            padding: 3rem 3rem 2.5rem;
            border-radius: 2rem;
            border: 1px solid #2f3550;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .lock-box .lock-icon {
            font-size: 4rem;
            color: #ffb347;
            margin-bottom: 0.5rem;
        }

        .lock-box h2 {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 300;
            margin-bottom: 0.3rem;
        }

        .lock-box p {
            color: #8a93b5;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .lock-box input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.1rem;
            border: 2px solid #3a3f5c;
            border-radius: 50px;
            background: #1a1f2e;
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .lock-box input:focus {
            border-color: #ffb347;
            box-shadow: 0 0 20px rgba(255, 179, 71, 0.15);
        }

        .lock-box .btn-unlock {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ffb347, #ff8a5c);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .lock-box .btn-unlock:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(255, 179, 71, 0.3);
        }

        .lock-box .lock-error {
            color: #ff6b6b;
            min-height: 1.5rem;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .lock-box .password-hint {
            color: #4a5a7a;
            font-size: 0.75rem;
            margin-top: 1rem;
        }

        .lock-box .password-hint strong {
            color: #ffb347;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .lobby-box {
                padding: 2rem 1.5rem;
            }
            .lobby-box h1 {
                font-size: 1.6rem;
            }
            .role-btn {
                padding: 14px 20px;
                font-size: 0.95rem;
            }
            .top-bar {
                padding: 8px 14px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .floating-controls {
                bottom: 16px;
                padding: 8px 12px;
                gap: 6px;
                width: 95%;
                border-radius: 30px;
            }
            .floating-controls button {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .lock-box {
                padding: 2rem 1.5rem;
            }
            .lock-box h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== LOBBY ===== -->
    <div id="lobby">
        <div class="lobby-box">
            <h1>📡 <span>Broadcast</span>Screen</h1>
            <div class="subtitle">🔗 Pastikan dalam 1 WiFi yang sama</div>
            <div class="role-buttons">
                <button class="role-btn guru" onclick="joinAs('guru')">
                    <i class="fas fa-chalkboard-teacher"></i> Guru · Broadcast
                </button>
                <button class="role-btn siswa" onclick="joinAs('siswa')">
                    <i class="fas fa-user-graduate"></i> Siswa · Lihat Layar
                </button>
            </div>
            <div class="lobby-footer">
                <i class="fas fa-wifi"></i> 1 WiFi · Real-time · Preview Bebas
            </div>
        </div>
    </div>

    <!-- ===== LOCK OVERLAY (POPUP PASSWORD) ===== -->
    <div id="lock-overlay">
        <div class="lock-box">
            <div class="lock-icon">🔒</div>
            <h2>Buka Kunci Layar</h2>
            <p>Masukkan password untuk keluar dari fullscreen</p>
            <input type="password" id="lock-password-input" placeholder="Masukkan password..." autocomplete="off" />
            <button class="btn-unlock" id="unlock-lock-btn">Buka Kunci</button>
            <div class="lock-error" id="lock-error"></div>
            <div class="password-hint">Password: <strong>siswa123</strong></div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="app-container">
        <div class="top-bar">
            <div class="brand">
                <i class="fas fa-desktop"></i>
                <span>Broadcast<span style="color:#4a7cf7;">Screen</span></span>
            </div>
            <div class="status">
                <span class="live-dot" id="live-dot"></span>
                <span id="live-status">Offline</span>
                <span class="role-badge" id="role-badge">Guru</span>
                <span class="wifi-badge"><i class="fas fa-wifi"></i> 1 WiFi</span>
            </div>
        </div>

        <div class="screen-area">
            <video id="screen-video" autoplay playsinline muted></video>
            <div class="waiting-message" id="waiting-msg">
                <i class="fas fa-hourglass-half"></i>
                Menunggu broadcast dari guru...
            </div>
        </div>
    </div>

    <!-- ===== FLOATING CONTROLS ===== -->
    <div class="floating-controls" id="controls">
        <button id="start-share" class="primary">
            <i class="fas fa-play"></i> Mulai Broadcast
        </button>
        <button id="stop-share" class="danger">
            <i class="fas fa-stop"></i> Stop
        </button>
        <div class="sep"></div>
        <button id="fullscreen-btn" class="success">
            <i class="fas fa-expand"></i> Fullscreen
        </button>
        <button id="lock-btn" style="color:#ffb347;">
            <i class="fas fa-lock"></i> Kunci Layar
        </button>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== KONFIGURASI =====
            const STUDENT_PASSWORD = 'siswa123';
            let currentRole = null;
            let mediaStream = null;
            let isSharing = false;
            let isFullscreen = false;
            let isLocked = false;

            // ===== DOM REFS =====
            const lobby = document.getElementById('lobby');
            const appContainer = document.getElementById('app-container');
            const video = document.getElementById('screen-video');
            const waitingMsg = document.getElementById('waiting-msg');
            const startBtn = document.getElementById('start-share');
            const stopBtn = document.getElementById('stop-share');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const lockBtn = document.getElementById('lock-btn');
            const lockOverlay = document.getElementById('lock-overlay');
            const lockPasswordInput = document.getElementById('lock-password-input');
            const unlockLockBtn = document.getElementById('unlock-lock-btn');
            const lockError = document.getElementById('lock-error');
            const liveDot = document.getElementById('live-dot');
            const liveStatus = document.getElementById('live-status');
            const roleBadge = document.getElementById('role-badge');

            // ===== JOIN LOBBY =====
            window.joinAs = function(role) {
                currentRole = role;
                lobby.style.display = 'none';
                appContainer.classList.add('active');

                if (role === 'guru') {
                    roleBadge.textContent = '👨‍🏫 Guru';
                    roleBadge.className = 'role-badge guru';
                    startBtn.style.display = 'flex';
                    stopBtn.style.display = 'flex';
                    fullscreenBtn.style.display = 'flex';
                    lockBtn.style.display = 'none';
                    
                    setTimeout(() => startScreenShare(), 600);
                } else {
                    // Siswa: preview bebas, tidak langsung dikunci
                    roleBadge.textContent = '👨‍🎓 Siswa';
                    roleBadge.className = 'role-badge siswa';
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'none';
                    fullscreenBtn.style.display = 'flex';
                    lockBtn.style.display = 'flex';
                    
                    waitingMsg.style.display = 'block';
                    
                    // Auto fullscreen untuk siswa (tapi siswa bisa lihat preview dulu)
                    setTimeout(() => {
                        requestFullscreen();
                    }, 800);
                    
                    listenForBroadcast();
                }
            };

            // ===== GURU: START BROADCAST =====
            async function startScreenShare() {
                if (isSharing) return;
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: {
                            cursor: 'always',
                            displaySurface: 'monitor',
                            frameRate: 30
                        },
                        audio: false
                    });

                    mediaStream = stream;
                    video.srcObject = stream;
                    await video.play();
                    isSharing = true;
                    waitingMsg.style.display = 'none';

                    liveDot.className = 'live-dot on';
                    liveStatus.textContent = 'LIVE';
                    startBtn.innerHTML = '<i class="fas fa-circle"></i> Broadcasting';
                    startBtn.style.background = '#00d26a';
                    startBtn.style.color = '#fff';

                    window._broadcastStream = stream;
                    window._isBroadcasting = true;

                    try {
                        const channel = new BroadcastChannel('broadcast_screen');
                        channel.postMessage({
                            type: 'broadcast_available',
                            timestamp: Date.now()
                        });
                    } catch (e) {
                        console.log('BroadcastChannel ready');
                    }

                    stream.getVideoTracks()[0].onended = function() {
                        stopScreenShare();
                    };

                } catch (err) {
                    console.error('Gagal share screen:', err);
                    alert('Tidak bisa mengakses layar. Pastikan izin diberikan.\n' + err.message);
                }
            }

            // ===== STOP SHARING =====
            function stopScreenShare() {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                    mediaStream = null;
                }
                video.srcObject = null;
                isSharing = false;
                window._isBroadcasting = false;
                window._broadcastStream = null;

                startBtn.innerHTML = '<i class="fas fa-play"></i> Mulai Broadcast';
                startBtn.style.background = '#4a7cf7';
                startBtn.style.color = '#fff';
                liveDot.className = 'live-dot';
                liveStatus.textContent = 'Offline';
                waitingMsg.style.display = 'block';
            }

            // ===== SISWA: LISTEN BROADCAST =====
            function listenForBroadcast() {
                if (window._isBroadcasting && window._broadcastStream) {
                    video.srcObject = window._broadcastStream;
                    video.play().then(() => {
                        waitingMsg.style.display = 'none';
                        liveDot.className = 'live-dot on';
                        liveStatus.textContent = 'LIVE';
                    }).catch(err => console.log('Gagal play:', err));
                    return;
                }

                try {
                    const channel = new BroadcastChannel('broadcast_screen');
                    
                    channel.postMessage({
                        type: 'request_stream',
                        senderId: 'siswa_' + Date.now()
                    });

                    channel.onmessage = function(e) {
                        if (e.data.type === 'broadcast_available' || e.data.type === 'stream_ready') {
                            if (window._broadcastStream) {
                                video.srcObject = window._broadcastStream;
                                video.play().then(() => {
                                    waitingMsg.style.display = 'none';
                                    liveDot.className = 'live-dot on';
                                    liveStatus.textContent = 'LIVE';
                                }).catch(err => console.log('Gagal play:', err));
                            }
                        }
                    };

                    const checkInterval = setInterval(() => {
                        if (window._broadcastStream && video.srcObject === null) {
                            video.srcObject = window._broadcastStream;
                            video.play().then(() => {
                                waitingMsg.style.display = 'none';
                                liveDot.className = 'live-dot on';
                                liveStatus.textContent = 'LIVE';
                                clearInterval(checkInterval);
                            }).catch(err => console.log('Gagal play:', err));
                        }
                    }, 2000);

                    setTimeout(() => clearInterval(checkInterval), 30000);

                } catch (e) {
                    console.log('BroadcastChannel tidak tersedia');
                    const fallbackInterval = setInterval(() => {
                        if (window._broadcastStream && video.srcObject === null) {
                            video.srcObject = window._broadcastStream;
                            video.play().then(() => {
                                waitingMsg.style.display = 'none';
                                liveDot.className = 'live-dot on';
                                liveStatus.textContent = 'LIVE';
                                clearInterval(fallbackInterval);
                            }).catch(err => console.log('Gagal play:', err));
                        }
                    }, 2000);
                }
            }

            // ===== FULLSCREEN =====
            function requestFullscreen() {
                const el = document.documentElement;
                if (!document.fullscreenElement) {
                    el.requestFullscreen?.() || el.webkitRequestFullscreen?.() || el.msRequestFullscreen?.();
                }
                isFullscreen = true;
            }

            function exitFullscreen() {
                if (document.fullscreenElement) {
                    document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.msExitFullscreen?.();
                    isFullscreen = false;
                }
            }

            // ===== LOCK / UNLOCK (popup password) =====
            function showLockPopup() {
                if (currentRole === 'guru') {
                    alert('Guru tidak perlu di-lock. Anda bebas bergerak.');
                    return;
                }
                if (!isFullscreen) {
                    alert('Masuk ke mode fullscreen terlebih dahulu.');
                    return;
                }
                isLocked = true;
                lockOverlay.classList.add('active');
                setTimeout(() => lockPasswordInput.focus(), 100);
            }

            function hideLockPopup() {
                isLocked = false;
                lockOverlay.classList.remove('active');
                lockPasswordInput.value = '';
                lockError.textContent = '';
            }

            function attemptUnlock() {
                const pass = lockPasswordInput.value.trim();
                if (pass === STUDENT_PASSWORD) {
                    hideLockPopup();
                    exitFullscreen();
                } else {
                    lockError.textContent = '❌ Password salah! Coba lagi.';
                    lockPasswordInput.value = '';
                    lockPasswordInput.focus();
                    setTimeout(() => { lockError.textContent = ''; }, 3000);
                }
            }

            // ===== EVENT LISTENERS =====
            startBtn.addEventListener('click', startScreenShare);
            stopBtn.addEventListener('click', function() {
                if (isSharing) stopScreenShare();
            });

            fullscreenBtn.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    requestFullscreen();
                } else {
                    if (currentRole === 'guru') {
                        exitFullscreen();
                    } else {
                        // Siswa: munculkan popup password
                        showLockPopup();
                    }
                }
            });

            lockBtn.addEventListener('click', showLockPopup);

            unlockLockBtn.addEventListener('click', attemptUnlock);

            lockPasswordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    attemptUnlock();
                }
            });

            // ===== BLOKIR ESCAPE UNTUK SISWA =====
            document.addEventListener('keydown', function(e) {
                // Jika siswa dan fullscreen, blokir escape & tampilkan popup
                if (currentRole === 'siswa' && isFullscreen) {
                    if (e.key === 'Escape' || e.key === 'Esc') {
                        e.preventDefault();
                        e.stopPropagation();
                        // Tampilkan popup password
                        if (!isLocked) {
                            showLockPopup();
                        }
                        return false;
                    }
                }

                // Blokir F11 untuk semua
                if (e.key === 'F11') {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }

                // Jika siswa, blokir shortcut lainnya
                if (currentRole === 'siswa') {
                    if (e.ctrlKey || e.metaKey) {
                        const blocked = ['w', 't', 'n', 'o', 'p', 'a', 's', 'q', 'e', 'r'];
                        if (blocked.includes(e.key.toLowerCase())) {
                            e.preventDefault();
                            e.stopPropagation();
                            return false;
                        }
                    }
                    if (e.altKey && (e.key === 'F4' || e.key === 'Tab')) {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }
                }
            }, true);

            document.addEventListener('contextmenu', function(e) {
                if (currentRole === 'siswa') {
                    e.preventDefault();
                    return false;
                }
            });

            // ===== FULLSCREEN CHANGE =====
            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement && currentRole === 'siswa' && !isLocked) {
                    // Siswa keluar fullscreen tanpa unlock, force kembali
                    setTimeout(() => {
                        if (!document.fullscreenElement && !isLocked) {
                            requestFullscreen();
                            // Tampilkan popup setelah force fullscreen
                            setTimeout(showLockPopup, 300);
                        }
                    }, 100);
                }
            });

            // ===== INIT =====
            console.log('📡 BroadcastScreen siap!');
            console.log('🔑 Password siswa: siswa123');

            if (window._broadcastStream) {
                video.srcObject = window._broadcastStream;
                video.play().then(() => {
                    waitingMsg.style.display = 'none';
                    liveDot.className = 'live-dot on';
                    liveStatus.textContent = 'LIVE';
                }).catch(err => console.log('Gagal play:', err));
            }

        })();
    </script>
