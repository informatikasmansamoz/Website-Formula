<html lang="id">

<style>
:root {
  --color-primary: #1A73E8;
  --color-primary-dark: #1557B0;
  --color-primary-light: #E8F0FE;
  --color-secondary: #34A853;
  --color-accent: #EA4335;
  --color-warning: #FBBC04;
  --color-dark: #202124;
  --color-gray-500: #737373;
  --color-gray-300: #D4D4D4;
  --color-gray-200: #E5E5E5;
  --color-gray-100: #F5F5F5;
  --color-light: #F8F9FA;
  --color-surface: #FFFFFF;
  --text-primary: #202124;
  --text-secondary: #525252;
  --text-muted: #737373;
  --border-color: #E5E5E5;
  --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  font-size: 16px; line-height: 1.6;
  color: var(--text-primary);
  background: #0A0E1A;
  overflow: hidden;
  min-height: 100vh;
  display: grid; place-items: center;
  -webkit-font-smoothing: antialiased;
  color-scheme: dark;
}
button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
::selection { background: var(--color-primary); color: white; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; border-radius: 4px; }

/* ============================================================
   BACKGROUND — Animated Grid + Orbs
   ============================================================ */
.bg {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at top, #0F1729 0%, #050810 60%, #000 100%);
  overflow: hidden;
}
.bg::before {
  content: '';
  position: absolute; inset: -50%;
  background:
    radial-gradient(circle at 20% 30%, rgba(26,115,232,0.18), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(52,168,83,0.12), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(124,77,255,0.10), transparent 50%);
  animation: bgShift 24s ease-in-out infinite;
}
@keyframes bgShift {
  0%,100% { transform: translate(0,0) rotate(0); }
  33%     { transform: translate(3%,-2%) rotate(2deg); }
  66%     { transform: translate(-3%,2%) rotate(-2deg); }
}
.grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(26,115,232,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,115,232,0.07) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  animation: gridScroll 30s linear infinite;
}
@keyframes gridScroll {
  from { background-position: 0 0; }
  to   { background-position: 40px 40px; }
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
}
.orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, #1A73E8, transparent 70%); top: 5%; left: -100px; opacity: 0.4; animation: float1 20s ease-in-out infinite; }
.orb-2 { width: 320px; height: 320px; background: radial-gradient(circle, #34A853, transparent 70%); bottom: 5%; right: -80px; opacity: 0.3; animation: float2 24s ease-in-out infinite; }
.orb-3 { width: 260px; height: 260px; background: radial-gradient(circle, #7C4DFF, transparent 70%); top: 50%; left: 45%; opacity: 0.25; animation: float3 28s ease-in-out infinite; }
@keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(80px, 50px) scale(1.15); } }
@keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px, -40px) scale(1.1); } }
@keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px, 60px) scale(1.2); } }

/* Scanline effect */
.scanline {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 0%, rgba(26,115,232,0.06) 50%, transparent 100%);
  background-size: 100% 8px;
  pointer-events: none;
  opacity: 0.5;
  animation: scanMove 8s linear infinite;
}
@keyframes scanMove {
  from { background-position: 0 -100vh; }
  to   { background-position: 0 100vh; }
}

/* ============================================================
   LOADING STAGE
   ============================================================ */
.loader {
  position: relative; z-index: 1;
  width: 100%;
  max-width: 560px;
  padding: 40px 24px;
  text-align: left;
  color: #C9D1E0;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.75;
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.loader.hide {
  opacity: 0;
  transform: translateY(-20px);
  pointer-events: none;
}

/* Terminal header */
.term-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.term-dot {
  width: 11px; height: 11px; border-radius: 50%;
}
.term-dot.red    { background: #FF5F56; }
.term-dot.yellow { background: #FFBD2E; }
.term-dot.green  { background: #27C93F; }
.term-title {
  margin-left: 8px;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* Log lines */
.logs {
  min-height: 200px;
  display: flex; flex-direction: column;
  gap: 2px;
}
.log-line {
  display: flex; gap: 10px;
  opacity: 0;
  transform: translateX(-8px);
  animation: logIn 0.25s ease-out forwards;
  word-break: break-word;
}
@keyframes logIn {
  to { opacity: 1; transform: translateX(0); }
}
.log-time {
  color: rgba(255,255,255,0.28);
  flex-shrink: 0;
  font-size: 11.5px;
}
.log-mark {
  flex-shrink: 0;
  width: 14px;
  text-align: center;
  font-weight: 700;
}
.log-mark.ok   { color: #27C93F; }
.log-mark.info { color: #4DA3FF; }
.log-mark.warn { color: #FFBD2E; }
.log-mark.dim  { color: rgba(255,255,255,0.28); }
.log-text { color: rgba(230,237,243,0.85); }
.log-text .accent { color: #4DA3FF; }
.log-text .green  { color: #27C93F; }
.log-text .dim    { color: rgba(255,255,255,0.35); }

/* Cursor */
.cursor {
  display: inline-block;
  width: 8px; height: 14px;
  background: #4DA3FF;
  vertical-align: middle;
  margin-left: 4px;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Progress bar */
.progress-wrap {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.progress-head {
  display: flex; justify-content: space-between;
  font-size: 11.5px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.progress-pct { color: #4DA3FF; font-weight: 700; }
.progress-bar {
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.progress-bar > span {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #1A73E8, #4DA3FF, #34A853);
  background-size: 200% 100%;
  border-radius: 999px;
  transition: width 0.3s ease;
  animation: gradientShift 2s linear infinite;
}
@keyframes gradientShift {
  0%   { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

/* ============================================================
   LOGIN STAGE
   ============================================================ */
.login {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  width: 100%;
  max-width: 420px;
  padding: 24px;
  text-align: center;
  z-index: 1;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
              transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.login.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: auto;
}

/* Logo */
.logo-wrap {
  position: relative;
  display: inline-block;
  margin-bottom: 32px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.logo-mark {
  width: 108px; height: 108px;
  border-radius: 28px;
  background: linear-gradient(135deg, #1A73E8 0%, #4285F4 50%, #34A853 130%);
  color: white;
  display: grid; place-items: center;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 54px;
  letter-spacing: -0.04em;
  box-shadow:
    0 20px 60px rgba(26,115,232,0.45),
    0 0 0 1px rgba(255,255,255,0.08) inset,
    0 0 0 8px rgba(26,115,232,0.08);
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.3s ease;
  position: relative;
  z-index: 2;
}
.logo-mark:active { transform: scale(0.92); }

/* Ripple / ping saat diklik */
.logo-wrap .ping {
  position: absolute;
  inset: 0;
  border-radius: 28px;
  border: 2px solid rgba(77,163,255,0.6);
  opacity: 0;
  pointer-events: none;
}
.logo-wrap .ping.pulse {
  animation: pingOut 0.7s cubic-bezier(0,0,0.2,1);
}
@keyframes pingOut {
  0%   { opacity: 0.9; transform: scale(1); }
  100% { opacity: 0;   transform: scale(1.6); }
}

/* Rotating rings */
.logo-wrap::before,
.logo-wrap::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  border-radius: 50%;
  border: 1.5px dashed rgba(77,163,255,0.25);
  pointer-events: none;
  transform: translate(-50%,-50%);
}
.logo-wrap::before {
  width: 150px; height: 150px;
  animation: rotate 20s linear infinite;
}
.logo-wrap::after {
  width: 190px; height: 190px;
  border-color: rgba(52,168,83,0.18);
  animation: rotate 30s linear infinite reverse;
}
@keyframes rotate {
  to { transform: translate(-50%,-50%) rotate(360deg); }
}

/* Title */
.login h1 {
  font-family: var(--font-heading);
  font-size: 24px;
  font-weight: 800;
  color: white;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}
.login p.sub {
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 32px;
  line-height: 1.6;
}

/* Buttons */
.actions {
  display: flex; flex-direction: column; gap: 12px;
  margin-bottom: 24px;
}
.btn-main {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 15px 24px;
  font-family: var(--font-heading);
  font-size: 15px;
  font-weight: 700;
  color: white;
  background: linear-gradient(135deg, #1A73E8, #4285F4);
  border-radius: 14px;
  box-shadow:
    0 8px 24px rgba(26,115,232,0.4),
    0 0 0 1px rgba(255,255,255,0.08) inset;
  transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  min-height: 52px;
}
.btn-main::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #1557B0, #1A73E8);
  opacity: 0;
  transition: opacity 0.22s;
}
.btn-main > * { position: relative; z-index: 1; }
.btn-main:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(26,115,232,0.5), 0 0 0 1px rgba(255,255,255,0.08) inset; }
.btn-main:hover::before { opacity: 1; }
.btn-main:active { transform: translateY(0) scale(0.98); }
.btn-main svg { width: 18px; height: 18px; }

/* Hint klik logo */
.hint {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  line-height: 1.6;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: color 0.3s;
}
.hint.active { color: #4DA3FF; font-weight: 600; }
.hint svg { width: 14px; height: 14px; }

/* Counter titik klik logo */
.dots {
  display: flex; gap: 6px; justify-content: center;
  margin-top: 12px;
  min-height: 8px;
}
.dots .d {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  transition: all 0.2s;
}
.dots .d.on {
  background: #4DA3FF;
  box-shadow: 0 0 8px rgba(77,163,255,0.8);
  transform: scale(1.3);
}

/* Loading redirect overlay */
.redirect-overlay {
  position: fixed; inset: 0;
  background: rgba(5,8,16,0.96);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: grid; place-items: center;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
.redirect-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.redirect-inner {
  text-align: center;
  color: white;
  font-family: var(--font-mono);
  font-size: 13px;
}
.redirect-spinner {
  width: 48px; height: 48px;
  margin: 0 auto 20px;
  border: 3px solid rgba(77,163,255,0.2);
  border-top-color: #4DA3FF;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.redirect-text {
  color: rgba(255,255,255,0.7);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-size: 11.5px;
}
.redirect-target {
  color: #4DA3FF;
  font-weight: 700;
  margin-top: 6px;
  font-size: 12px;
  word-break: break-all;
}

/* Watermark */
.watermark {
  position: fixed;
  bottom: 16px; left: 50%;
  transform: translateX(-50%);
  z-index: 1;
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.watermark .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #34A853;
  box-shadow: 0 0 8px rgba(52,168,83,0.8);
  animation: blink 2s ease-in-out infinite;
}

@media (max-width: 480px) {
  .loader { font-size: 12px; padding: 24px 18px; }
  .logo-mark { width: 92px; height: 92px; font-size: 46px; border-radius: 24px; }
  .logo-wrap::before { width: 130px; height: 130px; }
  .logo-wrap::after { width: 165px; height: 165px; }
  .login h1 { font-size: 21px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

  <div class="grid"></div>
  <div class="scanline"></div>

     RENDER LOG
     ============================================================ */
  const logsEl = document.getElementById('logs');
  const progressBar = document.getElementById('progressBar');
  const progressPct = document.getElementById('progressPct');
  const progressLabel = document.getElementById('progressLabel');
  const loader = document.getElementById('loader');
  const login = document.getElementById('login');

  const markSymbol = {
    ok: '✓',
    info: '›',
    warn: '!',
    dim: '·'
  };

  const fmtTime = () => {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  };

  const appendLog = (mark, text) => {
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML =
      '<span class="log-time">' + fmtTime() + '</span>' +
      '<span class="log-mark ' + mark + '">' + (markSymbol[mark] || '·') + '</span>' +
      '<span class="log-text">' + text + '</span>';
    logsEl.appendChild(line);

    // Auto-scroll
    logsEl.scrollTop = logsEl.scrollHeight;

    // Batasi log agar tidak overflow (keep last 12)
    while (logsEl.children.length > 14) {
      logsEl.removeChild(logsEl.firstChild);
    }
  };

  /* ============================================================
     ANIMASI PROGRESS
     ============================================================ */
  let progress = 0;
  const progressTimer = setInterval(() => {
    // Progress melaju tidak linear biar natural
    const step = progress < 60 ? 2 : progress < 85 ? 1.2 : 0.5;
    progress = Math.min(100, progress + step);
    progressBar.style.width = progress + '%';
    progressPct.textContent = Math.round(progress) + '%';

    if (progress < 30) progressLabel.textContent = 'Menyiapkan sistem...';
    else if (progress < 60) progressLabel.textContent = 'Memuat modul...';
    else if (progress < 85) progressLabel.textContent = 'Menghubungkan...';
    else if (progress < 100) progressLabel.textContent = 'Hampir selesai...';
    else progressLabel.textContent = 'Selesai!';

    if (progress >= 100) clearInterval(progressTimer);
  }, 100);

  /* ============================================================
     JALANKAN LOG SCRIPT
     ============================================================ */
  LOG_SCRIPT.forEach((entry) => {
    setTimeout(() => appendLog(entry.mark, entry.text), entry.t);
  });

  /* ============================================================
     TRANSISI KE STAGE 2 — LOGIN
     ============================================================ */
  const showLogin = () => {
    loader.classList.add('hide');
    setTimeout(() => {
      loader.style.display = 'none';
      login.classList.add('show');
    }, 400);
  };

  setTimeout(() => {
    // Pastikan progress penuh dulu
    progress = 100;
    progressBar.style.width = '100%';
    progressPct.textContent = '100%';
    progressLabel.textContent = 'Selesai!';
    clearInterval(progressTimer);

    // Delay kecil biar log terakhir kelihatan
    setTimeout(showLogin, 800);
  }, LOADING_DURATION);

  /* ============================================================
     REDIRECT HELPER
     ============================================================ */
  const redirectOverlay = document.getElementById('redirectOverlay');
  const redirectTarget = document.getElementById('redirectTarget');

  const goTo = (url) => {
    redirectTarget.textContent = url;
    redirectOverlay.classList.add('show');
    setTimeout(() => {
      window.location.href = url;
    }, 700);
  };

  /* ============================================================
     BUTTON USER
     ============================================================ */
  document.getElementById('btnUser').addEventListener('click', () => {
    goTo(USER_URL);
  });

  /* ============================================================
     LOGO: KLIK 5× → ADMIN
     ============================================================ */
  const logoWrap = document.getElementById('logoWrap');
  const ping = document.getElementById('ping');
  const hint = document.getElementById('hint');
  const dots = document.querySelectorAll('#dots .d');

  let clickCount = 0;
  let clickTimer = null;

  const resetClicks = () => {
    clickCount = 0;
    dots.forEach((d) => d.classList.remove('on'));
    hint.classList.remove('active');
    hint.querySelector('span').textContent = 'Ketuk logo 5× untuk akses admin';
  };

  const handleLogoClick = () => {
    // Animasi ping
    ping.classList.remove('pulse');
    void ping.offsetWidth; // reflow
    ping.classList.add('pulse');

    // Getar (kalau didukung)
    if (navigator.vibrate) navigator.vibrate(30);

    clickCount++;

    // Update dots
    dots.forEach((d, i) => {
      d.classList.toggle('on', i < clickCount);
    });

    // Update hint text
    hint.classList.add('active');
    const sisa = CLICKS_FOR_ADMIN - clickCount;
    if (sisa > 0) {
      hint.querySelector('span').textContent = 'Ketuk ' + sisa + '× lagi untuk admin...';
    } else {
      hint.querySelector('span').textContent = 'Membuka akses admin...';
    }

    // Reset timer
    clearTimeout(clickTimer);
    clickTimer = setTimeout(resetClicks, 2000);

    // Trigger admin
    if (clickCount >= CLICKS_FOR_ADMIN) {
      clearTimeout(clickTimer);
      setTimeout(() => {
        goTo(ADMIN_URL);
      }, 300);
    }
  };

  logoWrap.addEventListener('click', handleLogoClick);
  logoWrap.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      handleLogoClick();
    }
  });

  /* ============================================================
     CEK AKSES LANGSUNG (opsional):
     Kalau user buka ?role=admin atau ?role=user, skip langsung
     ============================================================ */
  const params = new URLSearchParams(location.search);
  const role = params.get('role');
  if (role === 'admin') {
    // Skip loading, langsung redirect admin
    setTimeout(() => goTo(ADMIN_URL), 300);
  } else if (role === 'user') {
    setTimeout(() => goTo(USER_URL), 300);
  }

})();
</script>

</body>
</html>
